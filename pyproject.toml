[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pokeagent-bench"
version = "0.37.4"
description = "Controlled Pokemon Red benchmarks for AI agents"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = [
  "pokecore @ https://github.com/afk-sapien/pokesim/releases/download/pokecore-v0.12.3/pokecore-0.12.3-py3-none-any.whl#sha256=c064f6e564d22efa38e38b75a6de552f40d2f21cb9afb03c1d19666f47531668",
  "pyboy-rs @ https://github.com/afk-sapien/pyboy-rs/releases/download/v0.1.7/pyboy_rs-0.1.7-cp311-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl#sha256=9c781e7bf5b09c8e7818c8a09b5c48d08b791c18a2871e81c306c456564019dd ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "pyboy-rs @ https://github.com/afk-sapien/pyboy-rs/releases/download/v0.1.7/pyboy_rs-0.1.7-cp311-abi3-manylinux_2_17_aarch64.manylinux2014_aarch64.whl#sha256=bd485b88179252cbe33152e0cc5e787c99f3652e08f0a05dd2e988d9dc2a9b68 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
  "pyboy-rs @ https://github.com/afk-sapien/pyboy-rs/releases/download/v0.1.7/pyboy_rs-0.1.7-cp311-abi3-macosx_10_12_x86_64.whl#sha256=93408f3bca231f36a9dca0ef6279d03e0bb87694acb4d33e3162a711d53e1ec6 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "pyboy-rs @ https://github.com/afk-sapien/pyboy-rs/releases/download/v0.1.7/pyboy_rs-0.1.7-cp311-abi3-macosx_11_0_arm64.whl#sha256=95162264d07374deaabb49d3fda25cfd83d7804cf6b127f8316e1fe4e1f411d6 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "pyboy-rs @ https://github.com/afk-sapien/pyboy-rs/releases/download/v0.1.7/pyboy_rs-0.1.7-cp311-abi3-win_amd64.whl#sha256=7be26347ccd3d4cd6b9de9781dd91c6c40a8d3e0f3e08114802609d82bd43193 ; sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
  "pillow>=10,<13",
  "numpy>=1.26,<3",
  "httpx>=0.28,<0.29",
  "jsonschema>=4.23,<5",
  "mcp>=1.26,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "zstandard>=0.23,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
pokebench = "pokeagent_bench.cli:main"
pokeagent = "pokeagent_bench.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["paper/analysis/scripts/_*.py", "paper/analysis/scripts/_toolchain", "paper/audio"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "scripts/", "docs/", "examples/", "fixtures/", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "pyproject.toml", "uv.lock", ".python-version"]
exclude = ["**/__pycache__", "**/*.pyc", "**/.pytest_cache"]
