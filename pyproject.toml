[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pokeagent-bench"
version = "0.36.0"
description = "Controlled Pokemon Red benchmarks for AI agents"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = [
  "pokecore @ https://github.com/afk-sapien/pokesim/releases/download/pokecore-v0.12.0/pokecore-0.12.0-py3-none-any.whl#sha256=d46507a9ad1da173d395d473c07ff0c9d586fc91d5fd1f16246f2f82ae195869",
  "pyboy-rs @ https://github.com/afk-sapien/pyboy-rs/releases/download/v0.1.5/pyboy_rs-0.1.5-cp311-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl#sha256=85d000b9d6607f449b6a945bed7923ca3e1adb5bb97dc1606508501eef1da89d ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "pyboy-rs @ https://github.com/afk-sapien/pyboy-rs/releases/download/v0.1.5/pyboy_rs-0.1.5-cp311-abi3-manylinux_2_17_aarch64.manylinux2014_aarch64.whl#sha256=b332de4bec17fbd4c9f5bca3c399923c98df382344d9394174a2474cd5056759 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
  "pyboy-rs @ https://github.com/afk-sapien/pyboy-rs/releases/download/v0.1.5/pyboy_rs-0.1.5-cp311-abi3-macosx_10_12_x86_64.whl#sha256=e604f8d4e0bc33e6d37ebc0bf77e85beab5223e68324ff57f175a56d6ff9c9f3 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "pyboy-rs @ https://github.com/afk-sapien/pyboy-rs/releases/download/v0.1.5/pyboy_rs-0.1.5-cp311-abi3-macosx_11_0_arm64.whl#sha256=2ff240cc2156ca201c6dca0ad2c2829c2deb4b4a3428553e6bd0e23c91f6f172 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "pyboy-rs @ https://github.com/afk-sapien/pyboy-rs/releases/download/v0.1.5/pyboy_rs-0.1.5-cp311-abi3-win_amd64.whl#sha256=2517a5e44acc30f380e0070a8492a4d3241063b0a72638f87a84bd5651b3d9f7 ; sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
  "pillow>=10,<13",
  "numpy>=1.26,<3",
  "httpx>=0.28,<0.29",
  "jsonschema>=4.23,<5",
  "mcp>=1.26,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "zstandard>=0.23,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
pokebench = "pokeagent_bench.cli:main"
pokeagent = "pokeagent_bench.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["paper/analysis/scripts/_*.py", "paper/analysis/scripts/_toolchain", "paper/audio"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "scripts/", "docs/", "examples/", "fixtures/", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "pyproject.toml", "uv.lock", ".python-version"]
exclude = ["**/__pycache__", "**/*.pyc", "**/.pytest_cache"]
